name: Windows Development and Android Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: StandaloneWindows64
            artifact: Windows-Development
          - target: Android
            artifact: Android-Release
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # GitHub 호스팅 러너의 사전 설치 SDK를 제거해 대형 Unity Docker 이미지 공간을 확보
      - name: Free disk space for Unity Docker image
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force

          echo "Disk usage after cleanup:"
          df -h /

      - name: Check Android signing secrets
        if: matrix.target == 'Android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - name: Check Android build disk budget
        if: matrix.target == 'Android'
        shell: bash
        env:
          MIN_ANDROID_BUILD_FREE_GIB: '50'
        run: |
          set -euo pipefail

          echo "Disk usage before Android Unity build:"
          df -h /
          du -sh "$GITHUB_WORKSPACE" 2>/dev/null || true
          du -sh "$GITHUB_WORKSPACE/Library" 2>/dev/null || true
          docker system df || true

          available_kib="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          required_kib="$((MIN_ANDROID_BUILD_FREE_GIB * 1024 * 1024))"
          available_gib="$((available_kib / 1024 / 1024))"

          if (( available_kib < required_kib )); then
            echo "::error title=Insufficient Android build disk::Unity Android 빌드 시작 전 ${MIN_ANDROID_BUILD_FREE_GIB} GiB 이상이 필요하지만 ${available_gib} GiB만 남았습니다. 장시간 빌드를 시작하지 않습니다."
            exit 1
          fi

          echo "Android build disk budget passed: ${available_gib} GiB available"

      - name: Build Windows Development
        if: matrix.target == 'StandaloneWindows64'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: BuildScript.PerformBuild
          versioning: None

      - name: Build signed Android Release AAB
        if: matrix.target == 'Android'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          buildMethod: BuildScript.PerformBuild
          versioning: None
          androidExportType: androidAppBundle
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Preserve Android AAB
        if: matrix.target == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-AAB
          path: Builds/Android/SeaVillage.aab
          if-no-files-found: error

      - name: Package Windows runtime
        if: matrix.target == 'StandaloneWindows64'
        working-directory: Builds/Windows/Development
        run: zip -r "$GITHUB_WORKSPACE/Windows-Development.zip" .

      - name: Upload Windows Development
        if: matrix.target == 'StandaloneWindows64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Windows-Development.zip
          if-no-files-found: error

  android-apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: Android-Release-AAB
          path: Builds/Android

      - name: Set up Java for bundletool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate signed APK from AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: bash .github/scripts/build-universal-apk.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: Builds/Android/SeaVillage.apk
          if-no-files-found: error

  release:
    needs: [build, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish all builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (Windows Dev + Android Release)
          files: |
            artifacts/Windows-Development.zip
            artifacts/SeaVillage.aab
            artifacts/SeaVillage.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
